[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lamcp-archicad"
version = "0.1.0"
description = "Lambda MCP for Archicad: teach your LLM to do Archicad tricks, via the Tapir Add-On."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gramazio Kohler Research, ETH Zürich" }]
license = { file = "LICENSE" }
keywords = ["mcp", "archicad", "tapir", "bim", "claude", "llm", "bridge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.7,<0.16",
]

[project.scripts]
lamcp-archicad = "lamcp_archicad.server:main"

[tool.hatch.build.targets.wheel]
packages = ["lamcp_archicad"]

[tool.ruff]
line-length = 120
